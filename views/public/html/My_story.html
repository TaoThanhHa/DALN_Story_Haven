<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truyện của tôi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/My_story.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="../images/Book Haven (3).png" alt="Story Haven" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Thể loại</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Comedy</a></li>
              <li><a class="dropdown-item" href="#">Drama</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="/my-story">Tác phẩm của tôi</a></li>
          <li class="nav-item"><a class="nav-link" href="/library">Thư viện</a></li>
        </ul>

        <form class="d-flex">
          <input class="form-control rounded-start-pill" type="text" placeholder="Tìm kiếm truyện...">
          <button class="btn btn-outline-success rounded-end-pill" type="submit"><i class="fas fa-search"></i></button>
        </form>

        <div class="dropdown ms-3">
          <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <img src="../images/schwi.png" alt="Avatar" class="rounded-circle" width="32" height="32">
            <span class="ms-2" id="profileName"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/account">Hồ sơ của tôi</a></li>
            <li><a class="dropdown-item" href="/login">Đăng xuất</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Nội dung -->
  <div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Truyện của tôi</h1>
    <div class="d-flex">
      <!-- Thanh tìm kiếm -->
      <input type="text" id="searchMyStory" class="form-control me-2" placeholder="Tìm truyện...">
      <a href="/story/new" class="btn btn-success">+ Truyện mới</a>
    </div>
  </div>

  <div class="card story-card p-3" id="storyContainer">
    <!-- Danh sách truyện render ở đây -->
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/mystory.js"></script>
</body>
</html>
