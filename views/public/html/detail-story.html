<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết truyện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/Story_information.css">
</head>
<body>
  <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
        <a class="navbar-brand" href="/">
            <img src="../images/Book Haven (3).png" alt="Story Haven" height="40">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Thể loại</a>
                <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Comedy</a></li>
                <li><a class="dropdown-item" href="#">Drama</a></li>
                </ul>
            </li>
            <li class="nav-item"><a class="nav-link" href="/my-story">Tác phẩm của tôi</a></li>
            <li class="nav-item"><a class="nav-link" href="/library">Thư viện</a></li>
            </ul>

            <form class="d-flex search-form">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm truyện...">
            <button class="btn btn-outline-success" type="submit"><i class="fas fa-search"></i></button>
            </form>

            <div class="nav-item dropdown ms-3">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                <img src="../images/schwi.png" alt="Avatar" class="rounded-circle" width="30" height="30">
                <span id="profileName"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/account">Hồ sơ của tôi</a></li>
                <li><a class="dropdown-item" href="/login">Đăng xuất</a></li>
            </ul>
            </div>
        </div>
        </div>
    </nav>

    <!-- Thông tin truyện -->
    <div class="story">
        <div class="story-bg">
        <div class="container">
            <div class="row">
            <div class="col-md-4 cover-photo">
                <img src="../images/placeholder.jpg" alt="Cover Photo">
            </div>
            <div class="col-md-8 story-infor">
                <h1 class="story-name"></h1>
                <ul class="list-unstyled">
                <li>Tác giả:</li>
                <li>Thể loại:</li>
                </ul>
                <p class="story-description"></p>
                <div class="d-flex align-items-center">
                <div class="interaction-container">
                    <i class="fas fa-eye"></i> <span id="views">0</span>
                </div>
                <div class="interaction-container">
                    <i class="fas fa-star"></i> <span id="likes">0</span>
                </div>
                </div>
                <div class="mt-3">
                <a href="#" class="btn btn-read">Đọc từ chương 1</a>
                <button class="btn btn-follow" id="Follow"><i class="fa fa-heart"></i> Theo dõi</button>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>

        <!-- Danh sách chương -->
    <div class="container chapter-list">
        <h2>Các chương truyện</h2>
        <div class="list-group" id="chapterList"></div>

        <!-- Pagination -->
        <nav>
        <ul class="pagination justify-content-center mt-3" id="chapterPagination"></ul>
        </nav>
    </div>


  <!-- Footer -->
  <footer class="bg-light py-5 mt-5 border-top">
    <div class="container">
      <p class="text-center">© 2024 Story Haven</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/Story_information.js"></script>
</body>
</html>
